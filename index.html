<head>

<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600;700&family=JetBrains+Mono:wght@400;600;700;800&display=swap">
<style>
/* layout: smalle kolom; startscherm = kronkelend leerpad met units, lesscherm = voortgangsbalk, opdracht, antwoordzone, feedbackbalk onderin */
:root {
  --bg: #e9edf1; --surface: #f8fafb; --fg: #070c11; --muted: #3a4652; --line: #c7d0d9; --grid: rgba(12,19,26,.05);
  --primary: #0c9a5f; --primary-dark: #08734a; --heart: #d6304f; --xp: #b7790a;
  --bad: #c9302c; --bad-bg: #fbe3e3; --ok-bg: #d9f2e6;
  --term-bg: #0a0f14; --term-fg: #cfe3d8; --term-prompt: #3ddc97;
  --road: #1b232d; --road-edge: #b6c1cc; --dash: #3ddc97; --sign: #0c131a; --sign-fg: #3ddc97; --locked: #9aa6b2;
  --c1: #1f8fd6; --c2: #e0592f; --c3: #8358d8;
  --display: "JetBrains Mono", ui-monospace, "DejaVu Sans Mono", monospace;
  --sans: "IBM Plex Sans", system-ui, sans-serif;
  --mono: "JetBrains Mono", ui-monospace, "DejaVu Sans Mono", monospace;
}
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) {
  --bg: #070a0d; --surface: #0d1218; --fg: #eef4f8; --muted: #a8b6c3; --line: #2a3846; --grid: rgba(61,220,151,.045);
  --primary: #3ddc97; --primary-dark: #1f9e66; --heart: #ff5c7a; --xp: #ffb547;
  --bad: #ff5c5c; --bad-bg: #2a1216; --ok-bg: #0c241a;
  --term-bg: #030507; --term-fg: #cfe3d8; --term-prompt: #3ddc97;
  --road: #121a22; --road-edge: #1f2b37; --dash: #3ddc97; --sign: #050809; --sign-fg: #3ddc97; --locked: #5a6876;
  --c1: #4fc3ff; --c2: #ff7a59; --c3: #b48cff; color-scheme: dark } }
:root[data-theme="dark"] {
  --bg: #070a0d; --surface: #0d1218; --fg: #eef4f8; --muted: #a8b6c3; --line: #2a3846; --grid: rgba(61,220,151,.045);
  --primary: #3ddc97; --primary-dark: #1f9e66; --heart: #ff5c7a; --xp: #ffb547;
  --bad: #ff5c5c; --bad-bg: #2a1216; --ok-bg: #0c241a;
  --term-bg: #030507; --term-fg: #cfe3d8; --term-prompt: #3ddc97;
  --road: #121a22; --road-edge: #1f2b37; --dash: #3ddc97; --sign: #050809; --sign-fg: #3ddc97; --locked: #5a6876;
  --c1: #4fc3ff; --c2: #ff7a59; --c3: #b48cff; color-scheme: dark }
:root[data-theme="mid"] {
  --bg: #1c2530; --surface: #253140; --fg: #f4f8fb; --muted: #c4d0db; --line: #384757; --grid: rgba(255,255,255,.04);
  --primary: #3ddc97; --primary-dark: #1f9e66; --heart: #ff6b85; --xp: #ffb547;
  --bad: #ff6b6b; --bad-bg: #3a2228; --ok-bg: #173a2c;
  --term-bg: #05080b; --term-fg: #cfe3d8; --term-prompt: #3ddc97;
  --road: #121a22; --road-edge: #3a4a5a; --dash: #3ddc97; --sign: #0a0f14; --sign-fg: #3ddc97; --locked: #556575;
  --c1: #4fc3ff; --c2: #ff7a59; --c3: #b48cff; color-scheme: dark }

html, body { height: 100%; overflow: hidden; }
body { background: var(--bg); color: var(--fg); font: 16px/1.5 var(--sans);
  padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); padding-block: 20px; box-sizing: border-box; }
.frame { height: calc(100vh - 40px); height: calc(100dvh - 40px); box-sizing: border-box; padding: 20px; border: 2px solid var(--line); border-radius: 6px; background: var(--bg); overflow: hidden; display: flex; flex-direction: column; position: relative; }
.backbtn { position: absolute; left: 50%; bottom: 84px; transform: translateX(-50%); z-index: 20; font: 800 .9rem var(--sans); color: var(--bg); background: var(--primary);
  border: 0; border-radius: 2px; padding: 10px 18px; box-shadow: 0 0 18px color-mix(in srgb, var(--primary) 45%, transparent); cursor: pointer; white-space: nowrap; }
.sidehint { position: sticky; bottom: 0; justify-self: center; width: 34px; height: 34px; border-radius: 50%; border: 1px solid var(--line); padding: 0 0 5px;
  background: color-mix(in srgb, var(--surface) 90%, transparent); color: var(--primary); font: 700 1.2rem/1 var(--mono); cursor: pointer; animation: sidebob 1.6s ease-in-out infinite; }
.sidehint:hover { border-color: var(--primary); }
@keyframes sidebob { 0%, 100% { transform: translateY(0); } 50% { transform: translateY(4px); } }
@media (prefers-reduced-motion: reduce) { .sidehint { animation: none; } }
.layout::-webkit-scrollbar, .side::-webkit-scrollbar, .side-wrap::-webkit-scrollbar { display: none; }
.side, .side-wrap { scrollbar-width: none; }
.scrollhint { position: absolute; left: 50%; bottom: 14px; z-index: 19; transform: translateX(-50%); width: 40px; height: 40px; border-radius: 50%;
  border: 1px solid var(--line); background: color-mix(in srgb, var(--surface) 85%, transparent); color: var(--primary); font: 700 1.4rem/1 var(--mono);
  cursor: pointer; animation: hintbob 1.6s ease-in-out infinite; padding: 0 0 6px; }
.scrollhint:hover { border-color: var(--primary); }
@keyframes hintbob { 0%, 100% { transform: translate(-50%, 0); } 50% { transform: translate(-50%, 6px); } }
@media (prefers-reduced-motion: reduce) { .scrollhint { animation: none; } }
.backbtn:active { transform: translate(-50%, 2px); }
.topbar { flex: none; height: 44px; margin-bottom: 12px; display: flex; align-items: center; gap: 10px; }
.layout { flex: 1; min-height: 0; overflow-y: auto; scrollbar-width: none; box-sizing: border-box; display: grid; --wl: 230px; grid-template-columns: var(--wl) minmax(0, 1fr); gap: 24px; align-items: stretch; }
.app { max-width: 760px; width: 100%; margin: 0 auto; display: grid; gap: 20px; min-width: 0; }
.app:has(.lesson-top) { padding-bottom: 110px; }

/* zijbalk */
.side-wrap { display: contents; }
.tg { font: 800 1rem var(--sans); color: var(--muted); background: var(--bg); border: 2px solid var(--line); border-radius: 6px;
  width: 32px; height: 32px; padding: 0; cursor: pointer; justify-self: start; }
.tg:hover { color: var(--primary); border-color: var(--primary); }
.gear { position: absolute; top: 16px; right: 16px; width: 32px; height: 32px; padding: 0; font-size: 1.05rem; line-height: 1; color: var(--muted);
  background: var(--bg); border: 2px solid var(--line); border-radius: 6px; cursor: pointer; }
.sset { display: grid; gap: 6px; }
.sset small { font: 600 .68rem var(--mono); color: var(--muted); letter-spacing: .06em; text-transform: uppercase; margin-top: 4px; }
.side .seg { gap: 4px; }
.side .seg button { font: 600 .72rem var(--mono); padding: 4px 7px; }
.skip { display: block; margin: 5px auto 0; font: 700 .6rem var(--mono); letter-spacing: .08em; text-transform: uppercase; color: var(--sign-fg);
  background: transparent; border: 1px dashed currentColor; border-radius: 3px; padding: 2px 6px; cursor: pointer; }
.skip:hover { background: color-mix(in srgb, var(--sign-fg) 15%, transparent); }
.side h4 .skip { display: inline; margin: 0 0 0 4px; color: var(--primary); }
.gear:hover, .gear.act { color: var(--primary); border-color: var(--primary); }
.gear.tb { position: static; flex: none; }
.topbar { display: none !important; }
.ctrl { display: flex; gap: 6px; }
.sset { transition: outline-color .4s; outline: 1px solid transparent; outline-offset: 6px; border-radius: 4px; }
.sset.flash { outline-color: var(--primary); }
.side.lv .tg { justify-self: end; }
@media (min-width: 861px) {
  .side.lv { grid-column: 1; grid-row: 1; } .app { grid-column: 2; grid-row: 1; } .side:not(.lv) { grid-column: 1; grid-row: 1; }
  .layout:not(.show-set) .side:not(.lv), .layout.show-set .side.lv { display: none; }
  .layout.c-lv { --wl: 52px; }
  .layout.c-lv .side > :not(.ctrl) { display: none; }
  .layout.c-lv .side { padding: 8px; }
  .layout.c-lv .ctrl { flex-direction: column; align-items: center; }
  .layout.c-lv .side.lv, .layout.c-menu .side:not(.lv) { padding: 8px; justify-items: center; }
  .layout.c-lv .side.lv .tg, .layout.c-menu .side:not(.lv) .tg { justify-self: center; }
}
@media (max-width: 860px) { .tg, .topbar { display: none; } }
.side.lv { order: 1; }
.app { order: 2; }
.side { order: 3; }
.side { position: sticky; top: 0; align-self: start; height: calc(100vh - 84px); height: calc(100dvh - 84px); box-sizing: border-box; overflow-y: auto; align-content: start; display: grid; gap: 18px;
  background: var(--surface); border: 2px solid var(--line); border-radius: 6px; padding: 16px; }
.brand { font: 600 1.15rem var(--display); display: flex; align-items: center; gap: 8px; }
.brand i { font: 600 .85rem var(--mono); font-style: normal; background: var(--term-bg); color: var(--term-prompt); border-radius: 4px; padding: 2px 6px; }
.side h3 { margin: 0 0 6px; font-size: .72rem; text-transform: uppercase; letter-spacing: .1em; color: var(--muted); }
.side nav { display: grid; gap: 4px; }
.side h4 { margin: 8px 0 2px; font: 800 .74rem var(--sans); color: var(--muted); }
.nav { display: flex; align-items: center; gap: 10px; text-align: left; width: 100%; box-sizing: border-box; min-width: 0; font: 700 .95rem var(--sans); color: var(--fg);
  background: none; border: 2px solid transparent; border-radius: 6px; padding: 8px 10px; cursor: pointer; }
.nav:hover:not([disabled]) { background: var(--bg); }
.nav.act { border-color: var(--primary); background: var(--ok-bg); color: var(--primary); }
.nav[disabled] { color: var(--muted); cursor: not-allowed; }
.nav .ic { width: 22px; text-align: center; font-family: var(--mono); flex: none; }
.nav .lv { min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.side .stats { font-size: .9rem; gap: 10px; }
.chp { display: grid; gap: 6px; }
.chp-t { display: flex; justify-content: space-between; gap: 8px; font-size: .82rem; font-weight: 700; }
.chp .bar { height: 10px; }
.menu-btn { display: none; justify-self: start; font: 800 1rem var(--sans); color: var(--fg); background: var(--surface);
  border: 2px solid var(--line); border-radius: 6px; padding: 8px 14px; cursor: pointer; }
.scrim { position: fixed; inset: 0; background: rgba(0,0,0,.4); z-index: 29; }
@media (max-width: 860px) {
  .layout { grid-template-columns: minmax(0, 1fr); gap: 12px; }
  .menu-btn { display: block; }
  .side-wrap { display: grid; align-content: start; gap: 14px; position: fixed; top: 0; bottom: 0; left: 0; z-index: 30; width: min(300px, 88vw); overflow-y: auto; border-radius: 0 6px 6px 0; background: var(--bg);
    padding: calc(16px + env(safe-area-inset-top, 0px)) 14px 16px max(16px, env(safe-area-inset-left, 0px)); transform: translateX(-105%); transition: transform .25s; }
  .side-wrap.open { transform: none; }
  .side, .side.lv { position: relative; max-height: none; min-height: 0; height: auto; overflow: visible; }
}

/* instellingen */
.set { display: grid; gap: 8px; background: var(--surface); border: 2px solid var(--line); border-radius: 6px; padding: 14px; }
.set b { font-family: var(--display); font-weight: 600; font-size: 1.05rem; }
.seg { display: flex; flex-wrap: wrap; gap: 8px; }
.seg button { font: 700 .92rem var(--sans); color: var(--fg); background: var(--bg); border: 2px solid var(--line); border-radius: 6px; padding: 8px 14px; cursor: pointer; }
.seg button.on { border-color: var(--primary); background: var(--ok-bg); color: var(--primary); }
h1, h2 { font-family: var(--display); margin: 0; text-wrap: balance; }
h1 { font-size: 1.7rem; }
h2 { font-size: 1.35rem; }
.stats { display: flex; gap: 16px; font-weight: 800; font-variant-numeric: tabular-nums; flex-wrap: wrap; }
.stat { display: flex; align-items: center; gap: 6px; }
.stat.xp { color: var(--xp); } .stat.hearts { color: var(--heart); } .stat.streak { color: var(--primary); }
.top { display: flex; justify-content: space-between; align-items: center; gap: 12px; flex-wrap: wrap; }
.muted { color: var(--muted); margin: 0; }

/* leerpad */
.next { margin: 0; font-weight: 700; }
.head { position: sticky; top: 0; z-index: 6; background: var(--bg); display: grid; gap: 12px; padding-bottom: 12px; border-bottom: 2px solid var(--line); }
.osrow { display: flex; gap: 10px; align-items: center; flex-wrap: wrap; }
.osel { font: 700 .95rem var(--sans); color: var(--fg); background: var(--surface); border: 2px solid var(--line); border-radius: 6px; padding: 6px 10px; max-width: 100%; }
.next b { color: var(--primary); }
.roadwrap { position: relative; width: 100%; max-width: 720px; margin: 0 auto; }
.roadwrap > svg { display: block; width: 100%; height: auto; overflow: visible; }
.roadwrap path { fill: none; stroke-linecap: round; stroke-linejoin: round; }
.r-edge { stroke: var(--road-edge); } .r-asph { stroke: var(--road); } .r-dash { stroke: var(--dash); } .r-done { stroke: var(--primary); }
.pin { position: absolute; transform: translate(-50%, -100%); width: 40px; height: 52px; padding: 0; border: 0; background: none; cursor: pointer; z-index: 3; }
.pin svg { display: block; width: 100%; height: 100%; filter: drop-shadow(0 3px 2px rgba(0,0,0,.28)); transition: transform .15s; transform-origin: 50% 100%; }
.pin:hover:not([disabled]) svg { transform: scale(1.1); }
.pin[disabled] { cursor: not-allowed; }
.pin.final { width: 58px; height: 75px; }
.pin.cur::before { content: ""; position: absolute; left: 50%; bottom: -6px; width: 30px; height: 12px; margin-left: -15px;
  border-radius: 50%; background: var(--primary); animation: puls 1.4s ease-out infinite; }
@keyframes puls { from { transform: scale(.6); opacity: .7; } to { transform: scale(2); opacity: 0; } }
.pingo { position: absolute; width: 76px; transition: left 1.4s ease-in-out, top 1.4s ease-in-out; z-index: 4; pointer-events: none; transform: translate(-115%, -92%); animation: bob 1.2s ease-in-out infinite; }
.pingo img { display: block; width: 100%; height: auto; }
@keyframes bob { 0%, 100% { transform: translate(-115%, -92%); } 50% { transform: translate(-115%, -100%); } }
.pingo.walk { animation: none; }
.pingo.walk img { animation: waddle .28s ease-in-out infinite alternate; transform-origin: 50% 90%; }
@keyframes waddle { from { transform: rotate(-8deg) translateY(0); } to { transform: rotate(8deg) translateY(-3px); } }
@media (prefers-reduced-motion: reduce) { .pingo, .pingo.walk img { animation: none; } }
.lbl { position: absolute; transform: translateY(-50%); margin-top: -30px; max-width: 30%; box-sizing: border-box;
  background: var(--surface); border: 2px solid var(--line); border-radius: 6px; padding: 4px 10px; display: grid; line-height: 1.25; z-index: 2; }
.lbl.l { text-align: right; }
.lbl b { font: 600 .95rem var(--display); overflow-wrap: anywhere; }
.lbl span { font: 500 .74rem var(--mono); color: var(--muted); overflow-wrap: anywhere; }
.lbl.locked { opacity: .85; }
.lbl.cur { border-color: var(--primary); box-shadow: 0 0 0 4px var(--ok-bg); }
.lbl em { font: 800 .6rem var(--sans); font-style: normal; text-transform: uppercase; letter-spacing: .12em; color: var(--primary); }
.lbl.done { opacity: .95; } .lbl.done em { color: var(--muted); }
.pin.cur { width: 54px; height: 70px; }
.lbl.final { border-color: var(--xp); } .lbl.final b { font-size: 1.15rem; color: var(--xp); }
.sign { position: absolute; transform: translate(-50%, -50%); background: var(--sign); color: #fff; border: 2px solid #fff;
  box-shadow: 0 0 0 2px var(--sign), 0 4px 8px rgba(0,0,0,.2); border-radius: 6px; padding: 4px 14px; text-align: center; line-height: 1.2; white-space: nowrap; z-index: 2; }
.sign small { display: block; font: 800 .62rem var(--sans); letter-spacing: .14em; text-transform: uppercase; opacity: .85; }
.sign b { font: 600 1rem var(--display); }
@media (max-width: 480px) { .lbl { padding: 3px 7px; } .lbl b { font-size: .8rem; } .lbl span { font-size: .65rem; } }

/* les */
.lesson-top { display: grid; grid-template-columns: auto 1fr auto; gap: 12px; align-items: center; }
.close { border: 0; background: none; color: var(--muted); font: 800 1.5rem var(--sans); cursor: pointer; padding: 4px 8px; }
.bar { height: 16px; background: var(--line); border-radius: 2px; overflow: hidden; }
.bar i { display: block; height: 100%; background: var(--primary); border-radius: 2px; transition: width .3s; }
.kind { text-transform: uppercase; letter-spacing: .08em; font-size: .75rem; font-weight: 800; color: var(--primary); margin: 0; }
.q { font-size: 1.2rem; font-weight: 700; margin: 0; }
.q code, .opt code, .tip code { font-family: var(--mono); font-size: .9em; background: var(--surface); border: 1px solid var(--line); padding: 1px 6px; border-radius: 4px; }

.term { background: var(--term-bg); color: var(--term-fg); border-radius: 6px; padding: 14px; font: 14px/1.6 var(--mono);
  overflow-x: auto; min-width: 0; }
.term pre { margin: 0; white-space: pre; }
.term .pr { color: var(--term-prompt); }
.term-input { display: flex; gap: 8px; align-items: center; }
.term-input input { flex: 1; min-width: 0; background: transparent; border: 0; color: var(--term-fg); font: inherit; outline: none; caret-color: var(--term-prompt); }

.opts { display: grid; gap: 10px; }
.opt { text-align: left; font: 700 1rem var(--sans); color: var(--fg); background: var(--surface);
  border: 2px solid var(--line); border-radius: 6px; padding: 12px 14px; cursor: pointer; }
.opt:hover { border-color: var(--primary); }
.opt.sel { border-color: var(--primary); background: var(--ok-bg); }
.opt.mono { font-family: var(--mono); font-weight: 600; }
.opt.right { border-color: var(--primary); background: var(--ok-bg); box-shadow: 0 0 0 1px var(--primary); }
.opt.wrong { border-color: var(--bad); background: var(--bad-bg); text-decoration: line-through; }
.fb code.bad { color: var(--bad); text-decoration: line-through; }
.fb code.good { color: var(--primary); font-weight: 700; }
.term.fix .bad-line { color: var(--bad); text-decoration: line-through; }
.term.fix .ok-tag { color: var(--muted); }
.keylist { list-style: none; margin: 0; padding: 0; display: grid; gap: 5px; font-size: .74rem; line-height: 1.35; }
.keylist li { display: grid; grid-template-columns: 78px 1fr; gap: 6px; align-items: baseline; }
.keylist kbd { font: 600 .7rem var(--mono); border: 1px solid var(--line); border-bottom-width: 2px; border-radius: 3px; padding: 0 4px; justify-self: start; background: var(--bg); color: var(--fg); }
.keylist span { color: var(--muted); }
.keyhelp { position: fixed; inset: 0; z-index: 50; background: rgba(0,0,0,.55); display: grid; place-items: center; padding: 16px; }
.keyhelp > div { background: var(--surface); border: 1px solid var(--primary); border-radius: 6px; padding: 18px 22px; max-width: 520px; width: 100%; display: grid; gap: 10px; box-shadow: 0 0 30px color-mix(in srgb, var(--primary) 25%, transparent); }
.keyhelp b { font: 700 1rem var(--mono); color: var(--primary); }
.keyhelp ul { list-style: none; margin: 0; padding: 0; display: grid; gap: 6px; }
.keyhelp li { display: grid; grid-template-columns: 96px 1fr; gap: 10px; align-items: baseline; font-size: .9rem; }
.keyhelp kbd { font: 600 .8rem var(--mono); border: 1px solid var(--line); border-bottom-width: 2px; border-radius: 4px; padding: 1px 6px; justify-self: start; background: var(--bg); }
.pin:focus-visible { outline: 2px solid var(--primary); outline-offset: 4px; border-radius: 6px; }
.gw { text-decoration: underline dotted color-mix(in srgb, var(--primary) 70%, transparent); text-underline-offset: 3px; cursor: help; }
.gw:hover, .gw:focus-visible { color: var(--primary); outline: none; }
code.gc { cursor: help; }
.gtip { position: fixed; z-index: 60; background: var(--surface); color: var(--fg); border: 1px solid var(--primary); border-radius: 4px; padding: 7px 10px;
  font: 500 .8rem/1.45 var(--sans); white-space: pre-line; pointer-events: none; box-shadow: 0 6px 18px rgba(0,0,0,.35); }
.uitleg { border: 1px solid var(--line); border-left: 3px solid var(--primary); background: var(--surface); border-radius: 4px; padding: 10px 14px; display: grid; gap: 6px; font-size: .9rem; }
.uitleg > b { font: 700 .78rem var(--mono); letter-spacing: .06em; color: var(--primary); text-transform: uppercase; }
.uitleg > b code { text-transform: none; letter-spacing: 0; color: var(--fg); }
.uitleg ul { list-style: none; margin: 0; padding: 0; display: grid; gap: 4px; }
.uitleg li { display: grid; grid-template-columns: minmax(70px, max-content) 1fr; gap: 10px; align-items: baseline; }
.uitleg li code { font: 600 .82rem var(--mono); color: var(--primary); }
.uitleg li span { color: var(--fg); }
.term .tout { margin: 8px 0 0; white-space: pre; color: var(--term-fg); opacity: .9; }

.answer-line { min-height: 58px; border-bottom: 2px solid var(--line); display: flex; flex-wrap: wrap; gap: 8px; padding-bottom: 10px; align-items: flex-end; }
.bank { display: flex; flex-wrap: wrap; gap: 8px; justify-content: center; }
.tile { font: 600 .95rem var(--mono); background: var(--surface); color: var(--fg); border: 2px solid var(--line);
  border-radius: 6px; padding: 8px 12px; cursor: pointer; }
.tile.used { visibility: hidden; }

/* feedbackbalk */
.foot { position: fixed; left: 0; right: 0; bottom: 0; background: var(--surface); border-top: 2px solid var(--line);
  padding: 16px max(16px, env(safe-area-inset-right, 0px)) calc(16px + env(safe-area-inset-bottom, 0px)) max(16px, env(safe-area-inset-left, 0px)); }
.foot.ok { background: var(--ok-bg); border-color: var(--primary); }
.foot.bad { background: var(--bad-bg); border-color: var(--bad); }
.foot-in { max-width: 640px; margin: 0 auto; display: flex; gap: 14px; align-items: center; justify-content: space-between; flex-wrap: wrap; }
.fb { min-width: 0; flex: 1 1 260px; }
.fb strong { font-family: var(--display); font-size: 1.2rem; display: block; }
.foot.ok .fb strong { color: var(--primary); } .foot.bad .fb strong { color: var(--bad); }
.fb p { margin: 0; font-size: .92rem; }
.fb code { font-family: var(--mono); }
.btn { font: 800 1rem var(--sans); letter-spacing: .04em; text-transform: uppercase; border: 0; border-radius: 6px;
  padding: 13px 26px; background: var(--primary); color: var(--bg); box-shadow: none; cursor: pointer; flex: none; }
.btn:hover { box-shadow: 0 0 16px color-mix(in srgb, var(--primary) 50%, transparent); }
.btn:active { transform: translateY(1px); }
.btn[disabled] { background: var(--line); color: var(--muted); box-shadow: none; cursor: not-allowed; }
.foot.bad .btn { background: var(--bad); }
.btn.ghost { background: transparent; color: var(--muted); box-shadow: none; border: 2px solid var(--line); }

.done-card { text-align: center; display: grid; gap: 14px; justify-items: center; padding-top: 30px; }
.big { font: 600 3rem var(--display); color: var(--xp); }
.tip { position: sticky; bottom: 0; z-index: 6; display: flex; gap: 8px; align-items: flex-start; background: var(--surface);
  border: 2px dashed var(--line); border-radius: 6px; padding: 7px 12px; font-size: .82rem; line-height: 1.4; }
.tip.in-les { position: static; }
.tip.home-tip { justify-self: end; max-width: 260px; font-size: .74rem; padding: 6px 26px 6px 9px; margin-right: -8px; position: sticky; }
.tip-x { position: absolute; top: 2px; right: 4px; border: 0; background: none; color: var(--muted); font: 700 1rem var(--mono); cursor: pointer; padding: 0 4px; line-height: 1.2; }
.tip-x:hover { color: var(--fg); }
.tip-ic { flex: none; font-size: 1rem; line-height: 1.3; }

button:focus-visible, input:focus-visible { outline: 3px solid var(--primary); outline-offset: 2px; }
.toast { position: fixed; top: calc(16px + env(safe-area-inset-top, 0px)); right: max(16px, env(safe-area-inset-right, 0px)); z-index: 20;
  width: min(320px, calc(100vw - 32px)); background: var(--ok-bg); border: 2px solid var(--primary); border-radius: 6px;
  padding: 12px 14px; display: grid; gap: 8px; box-shadow: 0 6px 20px rgba(0,0,0,.15); transition: opacity .3s, transform .3s; }
.toast.weg { opacity: 0; transform: translateX(20px); }
.toast strong { font-family: var(--display); font-size: 1.2rem; color: var(--primary); }
.toast .term { padding: 8px 10px; font-size: 12px; }
/* hacker-laag */
.frame { background-color: var(--bg); background-image: linear-gradient(var(--grid) 1px, transparent 1px), linear-gradient(90deg, var(--grid) 1px, transparent 1px); background-size: 28px 28px; border-width: 1px; }
.side, .tip, .set, .opt, .tile, .lbl, .osel, .seg button, .tg, .gear, .menu-btn { border-width: 1px; }
h1 { font-size: 1.45rem; font-weight: 700; letter-spacing: -.01em; }
h1::before { content: "> "; color: var(--primary); }
h1::after { content: "_"; color: var(--primary); animation: blink 1.1s steps(1) infinite; }
@keyframes blink { 50% { opacity: 0; } }
h2 { font-weight: 700; }
.brand { font: 700 1rem var(--display); letter-spacing: -.01em; }
.side h3, .kind, .sign small, .set b { font-family: var(--mono); letter-spacing: .14em; }
.stat { font-family: var(--mono); font-weight: 700; font-size: .85rem; }
.nav { font: 500 .88rem var(--mono); }
.nav .ic { width: 30px; font-size: .72rem; color: var(--muted); }
.nav.act { box-shadow: inset 3px 0 0 var(--primary); border-color: transparent; }
.btn { font-family: var(--mono); letter-spacing: .12em; }
.opt { font: 500 .95rem var(--sans); }
.opt:hover, .tile:hover { border-color: var(--primary); box-shadow: 0 0 0 1px var(--primary); }
.q { font-weight: 600; }
.sign { background: var(--sign); color: var(--sign-fg); border: 1px solid var(--sign-fg); box-shadow: 0 0 14px color-mix(in srgb, var(--sign-fg) 35%, transparent); }
.sign b { font: 700 .9rem var(--mono); text-transform: uppercase; letter-spacing: .06em; }
.lbl b { font: 600 .85rem var(--mono); }
.lbl.cur { box-shadow: 0 0 14px color-mix(in srgb, var(--primary) 40%, transparent); }
.r-dash { filter: drop-shadow(0 0 3px var(--dash)); }
.r-done { filter: drop-shadow(0 0 5px var(--primary)); }
.term { border: 1px solid var(--line); box-shadow: inset 0 0 30px rgba(0,0,0,.5); }
.tip-ic { font: 700 .8rem var(--mono); color: var(--primary); }
.big { font-family: var(--mono); }
.toast { border-width: 1px; box-shadow: 0 0 22px color-mix(in srgb, var(--primary) 30%, transparent); }

function adapt(e) {

  const isCmd = o => /^[a-z~.-]/.test(o) && o.length < 40 && (!o.includes(' ') || /^(sudo )?[a-z-]+ -/.test(o) || /^[a-z-]+ [a-z./~-]+$/.test(o));

      const keep = shuffle([e.a, ...shuffle(e.opts.map((o, i) => i).filter(i => i !== e.a)).slice(0, 2)]);
      return { ...e, opts: keep.map(i => e.opts[i]), a: keep.indexOf(e.a) };
    }
    if (e.t === 'tiles') return { ...e, tiles: e.ans.split(' ') };
  }
  // hint verraadt het antwoord niet: alleen de vorm (niveau 1: met beginletter per woord)
  if (n <= 2 && e.t === 'type') return { ...e, hint: e.ans[0].split(' ').map(w => w.replace(/[A-Za-z0-9]/g, (c, i) => (n === 1 && i === w.search(/[A-Za-z0-9]/)) ? c : '_')).join(' ') };
  if (n >= 4 && e.t === 'tiles') return { ...e, t: 'type', ans: [e.ans] };

  return e;
}

const GL_OPS = {

 ';':['voert de commando’s na elkaar uit','runs the commands one after another'],
 '>':['schrijft de uitvoer naar een bestand en overschrijft het','writes the output to a file, overwriting it'],
 '>>':['voegt de uitvoer toe aan het eind van een bestand','appends the output to the end of a file'],
 '2>':['schrijft de foutmeldingen (kanaal 2) naar een bestand','writes the error messages (channel 2) to a file'],
 '2>/dev/null':['gooit foutmeldingen weg (/dev/null is een prullenbak zonder bodem)','throws error messages away (/dev/null is a bottomless bin)'],
 '&':['start het commando op de achtergrond','starts the command in the background']
};
const GL_ARG = {
 '..':['de map één niveau hoger','the folder one level up'], '.':['de huidige map','the current folder'], '~':['je thuismap','your home folder'], '-':['de vorige map','the previous folder'], '/':['de hoofdmap van het hele systeem','the root folder of the whole system'],
 '!!':['het vorige commando','the previous command'], flathub:['de bron (remote) waar de app vandaan komt','the source (remote) the app comes from'], aux:['a = alle gebruikers, u = details, x = ook zonder terminal','a = all users, u = details, x = also without a terminal']
};
function explain(cmd) {
  if (!cmd) return [];
  const L2 = st.set.lang === 'en' ? 1 : 0, out = [], add = (t, d) => out.push([t, d]);
  const tk = cmd.match(/"[^"]*"|'[^']*'|\S+/g) || [];
  let cur = null, expect = true;
  for (let i = 0; i < tk.length; i++) {
    let t = tk[i], sep = false;
    if (t.length > 1 && t.endsWith(';')) { t = t.slice(0, -1); sep = true; }
    if (GL_OPS[t]) { add(t, GL_OPS[t][L2]); expect = ['|', '&&', ';'].includes(t);
      if (['>', '>>', '2>'].includes(t) && tk[i + 1]) { add(tk[++i], L2 ? 'the file the output goes to' : 'het bestand waar de uitvoer naartoe gaat'); } continue; }
    if (expect) {
      if (/^[A-Za-z_]+=/.test(t)) add(t, L2 ? 'puts a value in a variable (no spaces around =)' : 'zet een waarde in een variabele (geen spaties rond =)');
      else if (t.startsWith('./')) add(t, L2 ? './ runs a program or script from the current folder' : './ start een programma of script uit de huidige map');
      else { cur = t; add(t, (GL_CMD[t] || [L2 ? 'the command' : 'het commando', 0])[L2] || (L2 ? 'the command' : 'het commando'));
        const sub = tk[i + 1] && GL_SUB[t + ' ' + tk[i + 1]]; if (sub) add(tk[++i], sub[L2]);
        expect = t === 'sudo' && tk[i + 1] && !tk[i + 1].startsWith('-') && tk[i + 1] !== '!!'; }
      if (sep) { add(';', GL_OPS[';'][L2]); expect = true; }
      continue;
    }
    const o = GL_OPT[cur] || {};
    if (o[t]) { if (o[t][2] && tk[i + 1]) add(t + ' ' + tk[++i], o[t][L2]); else add(t, o[t][L2]); }
    else if (t.startsWith('-') && t.length > 1) {
      const att = Object.keys(o).find(k => o[k][2] && k.length === 2 && t.startsWith(k) && t.length > 2);
      if (att) add(t, o[att][L2]);
      else if (/^-[A-Za-z]{2,}$/.test(t) && t.slice(1).split('').every(c => o['-' + c])) t.slice(1).split('').forEach(c => add('-' + c, o['-' + c][L2]));
      else if (GL_ARG[t]) add(t, GL_ARG[t][L2]);
      else add(t, L2 ? 'an option of ' + cur + ' (see ' + cur + ' --help)' : 'een optie van ' + cur + ' (zie ' + cur + ' --help)');
    }
    else if (GL_ARG[t]) add(t, GL_ARG[t][L2]);
    else if (/[*?]/.test(t)) add(t, L2 ? 'wildcard: * = any characters, ? = exactly one character' : 'wildcard: * = willekeurige tekens, ? = precies één teken');
    else if (/^\$/.test(t)) add(t, L2 ? '$ reads the value of a variable' : '$ leest de waarde van een variabele');
    else if (/@/.test(t)) add(t, L2 ? 'user@computer: who you log in as, and where' + (t.includes(':') ? '; after the : comes the path on that computer' : '') : 'gebruiker@computer: als wie je inlogt en waar' + (t.includes(':') ? '; na de : volgt het pad op die computer' : ''));
    else if (/^https?:/.test(t)) add(t, L2 ? 'the web address' : 'het internetadres');
    else if (/[\/~.]/.test(t)) add(t, L2 ? 'path or file name this works on' : 'pad of bestandsnaam waarop het werkt');
    else add(t, L2 ? 'argument: what the command works on (a name, word or package)' : 'argument: waar het commando mee werkt (een naam, woord of pakket)');
    if (sep) { add(';', GL_OPS[';'][L2]); expect = true; }
  }
  return out;
}

const GL_Q = {"Hoe kopieer je geselecteerde tekst in de terminal?": ["In de terminal is Ctrl+C al bezet: dat stopt het lopende commando. Daarom kopieer je met Ctrl+Shift+C.", "In the terminal Ctrl+C is already taken: it stops the running command. So you copy with Ctrl+Shift+C."], "Hoe plak je tekst in de terminal?": ["Net als bij kopiëren hoort Shift erbij: Ctrl+Shift+V plakt. Middelklik plakt de laatst geselecteerde tekst.", "Like copying, you add Shift: Ctrl+Shift+V pastes. A middle click pastes the last selected text."], "Wat doet <kbd>Tab</kbd> als je een half commando of half bestandsnaam typt?": ["Tab vult aan zodra er maar één mogelijkheid is. Zijn er meer, druk dan twee keer op Tab voor een lijst.", "Tab completes as soon as there is only one option. If there are several, press Tab twice to see a list."], "Zoek terug in je eerdere commando’s.": ["Ctrl+R start een zoekopdracht in je geschiedenis: typ een stukje van het commando, druk nog eens op Ctrl+R voor een oudere treffer en op Enter om het uit te voeren.", "Ctrl+R starts a search in your history: type part of the command, press Ctrl+R again for an older match and Enter to run it."], "Wat doet <kbd>Ctrl</kbd>+<kbd>L</kbd> in de terminal?": ["Ctrl+L wist het scherm, net als het commando clear. Je eerdere uitvoer kun je nog terugscrollen.", "Ctrl+L clears the screen, just like the clear command. You can still scroll back to earlier output."], "Wat doet <kbd>Ctrl</kbd>+<kbd>D</kbd> op een lege prompt?": ["Ctrl+D betekent ‘einde invoer’ (EOF). Op een lege prompt sluit dat de shell, net als exit.", "Ctrl+D means ‘end of input’ (EOF). On an empty prompt that closes the shell, just like exit."], "Hoe spring je naar het begin van de regel die je typt?": ["Ctrl+A gaat naar het begin van de regel, Ctrl+E naar het eind. Ctrl+U wist alles links van de cursor.", "Ctrl+A goes to the start of the line, Ctrl+E to the end. Ctrl+U deletes everything left of the cursor."], "Open de terminal Konsole.": ["In KDE Plasma, dus ook op Bazzite, opent Ctrl+Alt+T meteen Konsole.", "In KDE Plasma, and therefore on Bazzite, Ctrl+Alt+T opens Konsole right away."], "Wat doet de Meta-toets (de Windows-toets) in KDE Plasma?": ["KDE noemt de Windows-toets Meta. Los indrukken opent het startmenu; daarin kun je meteen typen om te zoeken.", "KDE calls the Windows key Meta. Pressing it on its own opens the app launcher, where you can start typing to search right away."], "Hoe open je KRunner om snel een app, bestand of commando te zoeken?": ["KRunner is de zoekbalk van KDE bovenaan het scherm. Je opent hem met Alt+Spatie of Alt+F2. Hij rekent ook en kan commando’s uitvoeren.", "KRunner is KDE’s search bar at the top of the screen. You open it with Alt+Space or Alt+F2. It also does sums and can run commands."], "Vergrendel je scherm.": ["In Cinnamon vergrendelt Ctrl+Alt+L het scherm.", "In Cinnamon Ctrl+Alt+L locks the screen."], "Hoe zet je een venster snel op de linkerhelft van het scherm?": ["Meta+pijltje tegelt het venster naar die kant (quick tile). Met Meta+→ zet je het op de rechterhelft.", "Meta+arrow tiles the window to that side (quick tile). Meta+→ puts it on the right half."], "Wat doet <kbd>Meta</kbd>+<kbd>Shift</kbd>+<kbd>S</kbd> in KDE Plasma?": ["Meta+Shift+S opent Spectacle om een rechthoek te kiezen voor een screenshot. De Print-toets maakt een screenshot van het hele scherm.", "Meta+Shift+S opens Spectacle to select a rectangle for a screenshot. The Print key captures the whole screen."], "Hoe wissel je tussen open vensters?": ["Alt+Tab wisselt tussen vensters; houd Alt vast en tik op Tab om verder te gaan. Ctrl+Tab wisselt tussen tabbladen binnen één programma.", "Alt+Tab switches windows; hold Alt and tap Tab to move on. Ctrl+Tab switches tabs inside one program."], "Hoe sluit je het actieve venster?": ["Alt+F4 sluit het actieve venster, in KDE, GNOME en Cinnamon (en ook op Windows).", "Alt+F4 closes the active window, in KDE, GNOME and Cinnamon (and on Windows too)."], "Wat doet de Super-toets (de Windows-toets) in GNOME?": ["GNOME noemt de Windows-toets Super. Hij opent het activiteitenoverzicht met je vensters en een zoekbalk; typ meteen om een app te zoeken.", "GNOME calls the Windows key Super. It opens the Activities overview with your windows and a search bar; type right away to find an app."], "Toon het overzicht van alle apps.": ["Super+A opent direct het raster met alle geïnstalleerde apps.", "Super+A opens the grid with all installed apps directly."], "Wat opent <kbd>Ctrl</kbd>+<kbd>Alt</kbd>+<kbd>T</kbd> op Ubuntu?": ["Op Ubuntu opent Ctrl+Alt+T de terminal. Op Fedora met GNOME stel je zo’n sneltoets zelf in via Instellingen › Toetsenbord.", "On Ubuntu Ctrl+Alt+T opens the terminal. On Fedora with GNOME you set up such a shortcut yourself in Settings › Keyboard."], "Hoe zet je een venster op de rechterhelft van het scherm?": ["Super+← en Super+→ tegelen een venster naar links of rechts, Super+↑ maximaliseert het.", "Super+← and Super+→ tile a window left or right, Super+↑ maximises it."], "Wat doet de Print-toets in GNOME?": ["Print opent de ingebouwde screenshot-tool, waarin je een gebied, venster of het hele scherm kiest.", "Print opens the built-in screenshot tool, where you pick an area, a window or the whole screen."], "Wat doet <kbd>Alt</kbd>+<kbd>F2</kbd> in GNOME?": ["Alt+F2 opent een klein invoervenster waarin je een commando typt en uitvoert, zonder terminal.", "Alt+F2 opens a small box where you type and run a command, without a terminal."], "Open de terminal.": ["In Linux Mint (Cinnamon) opent Ctrl+Alt+T de terminal.", "In Linux Mint (Cinnamon) Ctrl+Alt+T opens the terminal."], "Wat doet de Super-toets (de Windows-toets) in Cinnamon?": ["Super opent het Mint-menu; daarin kun je meteen typen om te zoeken.", "Super opens the Mint menu, where you can start typing to search right away."], "Wat doet <kbd>Ctrl</kbd>+<kbd>Alt</kbd>+<kbd>→</kbd> in Cinnamon?": ["Ctrl+Alt+← en → wisselen tussen werkruimtes (virtuele bureaubladen).", "Ctrl+Alt+← and → switch between workspaces (virtual desktops)."], "Hoe zet je een venster op de linkerhelft van het scherm?": ["Super+pijltje tegelt het venster naar die kant van het scherm.", "Super+arrow tiles the window to that side of the screen."], "Wat doet de Print-toets in Cinnamon?": ["Print maakt een screenshot van het scherm; met Alt+Print alleen van het actieve venster.", "Print takes a screenshot of the screen; Alt+Print only of the active window."],
 'Hoe stop je het commando dat nu in de terminal loopt?':['Ctrl+C stuurt het signaal SIGINT: het lopende commando stopt. Ctrl+Z pauzeert alleen, Esc doet niets in de shell en q werkt alleen in programma’s zoals less of man.','Ctrl+C sends the SIGINT signal: the running command stops. Ctrl+Z only pauses, Esc does nothing in the shell and q only works in programs like less or man.'],
 'Wat is Distrobox?':['Distrobox draait een andere Linux-distro (bijvoorbeeld Ubuntu of Arch) in een container, gekoppeld aan je thuismap. Daarin installeer je vrij met apt, dnf of pacman zonder het basissysteem te veranderen.','Distrobox runs another Linux distro (for example Ubuntu or Arch) in a container linked to your home folder. Inside it you install freely with apt, dnf or pacman without changing the base system.'],
 'Hoe sluit je een man-pagina af?':['man toont de handleiding in de pager less. Daarin stop je met q (quit); /woord zoekt en n springt naar de volgende treffer.','man shows the manual in the pager less. There you quit with q; /word searches and n jumps to the next match.'],
 'Welk pad is absoluut?':['Een absoluut pad begint altijd bij / (de hoofdmap), dus het werkt vanuit elke map. Een relatief pad begint vanaf de map waar je nu staat, zoals Documenten/notities, ./script.sh of ../foto.jpg.','An absolute path always starts at / (the root), so it works from any folder. A relative path starts from the folder you are in, like Documents/notes, ./script.sh or ../photo.jpg.'],
 'Waar wijst <code>~</code> naar?':['~ (tilde) is een afkorting voor je thuismap, zoals /home/sam. cd ~ en een kale cd brengen je daar allebei naartoe.','~ (tilde) is short for your home folder, like /home/sam. Both cd ~ and a bare cd take you there.'],
 'Wat matcht <code>foto?.jpg</code>?':['? staat voor precies één teken, * voor willekeurig veel tekens. foto?.jpg past dus op foto1.jpg of fotoA.jpg, maar niet op foto10.jpg (twee tekens) of foto.jpg (geen teken).','? stands for exactly one character, * for any number. So foto?.jpg matches foto1.jpg or fotoA.jpg, but not foto10.jpg (two characters) or foto.jpg (none).'],
 'Wat betekent <code>-type f</code>?':['Bij find kies je met -type het soort item: f = gewoon bestand (file), d = map (directory), l = snelkoppeling (link).','With find, -type picks the kind of item: f = regular file, d = directory, l = symbolic link.'],
 'Hoe sla je een bestand op in nano?':['Ctrl+O = write Out (opslaan); nano vraagt dan de bestandsnaam, bevestig met Enter. Onderaan nano staan alle sneltoetsen, ^ betekent Ctrl.','Ctrl+O = write Out (save); nano then asks for the file name, confirm with Enter. All shortcuts are listed at the bottom of nano, ^ means Ctrl.'],
 'Hoe sluit je nano af?':['Ctrl+X sluit nano. Zijn er onopgeslagen wijzigingen, dan vraagt nano eerst of je wilt opslaan (Y/N).','Ctrl+X closes nano. If there are unsaved changes, nano first asks whether to save (Y/N).'],
 'Wat mag de eigenaar bij <code>-rwxr-xr--</code>?':['Het eerste teken is het type (- = bestand, d = map). Daarna drie groepjes van drie: eigenaar rwx, groep r-x, anderen r--. r = lezen, w = schrijven, x = uitvoeren, - = niet.','The first character is the type (- = file, d = directory). Then three groups of three: owner rwx, group r-x, others r--. r = read, w = write, x = execute, - = not allowed.'],
 'Wat doet <kbd>Ctrl</kbd>+<kbd>Z</kbd> in de terminal?':['Ctrl+Z pauzeert (suspend) het lopende commando en geeft je de prompt terug. Met fg gaat het verder op de voorgrond, met bg op de achtergrond; jobs toont wat er gepauzeerd staat.','Ctrl+Z suspends the running command and gives you the prompt back. fg continues it in the foreground, bg in the background; jobs lists what is suspended.'],
 'Waar wordt een USB-stick meestal automatisch gekoppeld?':['De desktop koppelt (mount) verwisselbare schijven meestal onder /run/media/gebruiker (Fedora, Arch) of /media/gebruiker (Ubuntu, Mint). lsblk of df -h laat zien waar precies.','The desktop usually mounts removable drives under /run/media/user (Fedora, Arch) or /media/user (Ubuntu, Mint). lsblk or df -h shows exactly where.'],
 'Wat zet je op de eerste regel van een bash-script?':['#!/bin/bash heet de shebang: het vertelt het systeem welk programma het script moet uitvoeren. Daardoor werkt ./script.sh zonder er bash voor te typen.','#!/bin/bash is called the shebang: it tells the system which program should run the script. That is why ./script.sh works without typing bash in front.'],
 'Wat bevat <code>$1</code> in een script?':['$1 is het eerste argument dat je meegeeft (./backup.sh Foto’s → $1 = Foto’s), $2 het tweede, $# het aantal en $@ alle argumenten samen.','$1 is the first argument you pass (./backup.sh Photos → $1 = Photos), $2 the second, $# the count and $@ all arguments together.'],

function glossify(root) {

    const txt = node.nodeValue, hits = [];
    GL_RX.forEach(([rnl, ren, dn, de]) => { const rx = en ? ren : rnl; rx.lastIndex = 0; let m;
      while ((m = rx.exec(txt))) hits.push([m.index, m.index + m[0].length, en ? de : dn]); });
    if (!hits.length) return;
    hits.sort((a, b) => a[0] - b[0] || (b[1] - b[0]) - (a[1] - a[0]));
    let html = '', pos = 0;
    hits.forEach(([a, b, d]) => { if (a < pos) return; html += esc(txt.slice(pos, a)) + `<span class="gw" tabindex="0" data-tip="${esc(d).replace(/"/g, '&quot;')}">${esc(txt.slice(a, b))}</span>`; pos = b; });

  });

  root.querySelectorAll('.q code, .opt code, .tip code, .fb code').forEach(c => {
    if (c.dataset.tip) return;
    const rows = explain(c.textContent); if (!rows.length || /het commando|the command|argument/.test(rows[0][1])) return;
    c.dataset.tip = rows.map(([t, d]) => t + ': ' + d).join('\n'); c.classList.add('gc'); c.tabIndex = 0;
  });
  root.querySelectorAll('.opt.mono').forEach(o => {
    if (o.dataset.tip) return; const rows = explain(o.textContent.trim());
    if (rows.length && !/het commando|the command/.test(rows[0][1])) o.dataset.tip = rows.map(([t, d]) => t + ': ' + d).join('\n');

}

const UI_RX = [[/(\d+) van (\d+) haltes klaar, reeks/g, '$1 of $2 stops done, streak']].concat(
  Object.keys(UI).sort((a, b) => b.length - a.length).map(k => [new RegExp('(?<![\\p{L}\\d_-])' + k.replace(/[.*+?^${}()|[\]\\]/g, '\\$&') + '(?![\\p{L}\\d_-])', 'gu'), UI[k]]));
const SKIP_TR = 'CODE,KBD,PRE,SCRIPT,STYLE,.term,.tile,.answer-line';
function trNode(n) {
  if (st.set.lang !== 'en') return;
  if (n.nodeType === 3) {
    const p = n.parentElement; if (!p || p.closest(SKIP_TR)) return;
    let t = n.nodeValue, o = t; if (!/[A-Za-zÀ-ÿ]/.test(t)) return;
    for (const [rx, r] of UI_RX) t = t.replace(rx, r);
    if (t !== o) n.nodeValue = t;
  } else if (n.nodeType === 1 && !n.matches(SKIP_TR)) {
    if (n.title) { let t = n.title; for (const [rx, r] of UI_RX) t = t.replace(rx, r); if (t !== n.title) n.title = t; }
    n.childNodes.forEach(trNode);
  }
}
new MutationObserver(ms => { if (st.set.lang !== 'en') return; ms.forEach(m => m.type === 'characterData' ? trNode(m.target) : m.addedNodes.forEach(trNode)); })

const applyLang = () => { document.documentElement.lang = st.set.lang === 'en' ? 'en' : 'nl'; trNode(document.body); };

function keyHelp() {
  let k = document.getElementById('keyhelp');
  if (k) { k.remove(); return; }
  document.body.insertAdjacentHTML('beforeend', `<div class="keyhelp" id="keyhelp" role="dialog" aria-label="Sneltoetsen"><div><b>Sneltoetsen</b><ul>${KEYS_NL.map(([a, d]) => `<li><kbd>${a}</kbd><span>${d}</span></li>`).join('')}</ul><p class="muted">Druk op ? of Esc om te sluiten.</p></div></div>`);
  document.getElementById('keyhelp').onclick = e => { if (e.target.id === 'keyhelp') keyHelp(); };
}
document.addEventListener('keydown', ev => {
  const typing = /^(INPUT|SELECT|TEXTAREA)$/.test(ev.target.tagName);
  const inLesson = String(view).startsWith('l') || view === 'skip';
  if (ev.key === 'Escape') {
    ev.preventDefault();
    if (document.getElementById('keyhelp')) return keyHelp();
    if (sideEl.closest('.side-wrap').classList.contains('open')) return drawer(false);
    if (view !== 'home') return home();
    if (document.querySelector('.layout').classList.contains('show-set')) settings();
    return;
  }
  if (typing || ev.ctrlKey || ev.metaKey || ev.altKey) return;
  if (ev.key === '?') { ev.preventDefault(); return keyHelp(); }
  if (document.getElementById('keyhelp')) return;
  const k = ev.key.toLowerCase();
  if (k === 's') { ev.preventDefault(); return settings(); }
  if (k === 'b') { ev.preventDefault(); st.set.cLv = !st.set.cLv; save(); applyCollapse(); side(); return; }
  if (view === 'home') {
    if (ev.key === 'ArrowDown' || ev.key === 'ArrowUp') { ev.preventDefault(); layoutEl.scrollBy({ top: ev.key === 'ArrowDown' ? 160 : -160, behavior: 'smooth' }); }
    else if (k === 'h') { ev.preventDefault(); backBtn.onclick(); }
    else if (ev.key === 'Enter' && ev.target.tagName !== 'BUTTON') { ev.preventDefault(); const c = app.querySelector('.pin.cur'); if (c) c.click(); }
    return;
  }
  if (!inLesson) return;
  const opts = [...app.querySelectorAll('.opt:not([disabled])')], bank = [...app.querySelectorAll('.bank .tile:not(.used):not([disabled])')];
  if (opts.length && (ev.key === 'ArrowDown' || ev.key === 'ArrowUp')) {
    ev.preventDefault();
    let i = opts.findIndex(o => o.classList.contains('sel'));
    i = ev.key === 'ArrowDown' ? (i + 1) % opts.length : (i <= 0 ? opts.length - 1 : i - 1);
    opts[i].click(); opts[i].focus();
  } else if (/^[1-9]$/.test(ev.key) && (opts.length || bank.length)) {
    ev.preventDefault();
    const list = opts.length ? opts : bank, el = list[+ev.key - 1];
    if (el) { el.click(); if (opts.length) el.focus(); else { const nb = app.querySelector('.bank .tile:not(.used)'); if (nb) nb.focus(); } }
  } else if (bank.length && (ev.key === 'ArrowLeft' || ev.key === 'ArrowRight')) {
    ev.preventDefault();
    let i = bank.indexOf(document.activeElement);
    i = ev.key === 'ArrowRight' ? (i + 1) % bank.length : (i <= 0 ? bank.length - 1 : i - 1);
    bank[i].focus();
  } else if (ev.key === 'Backspace') {
    const placed = app.querySelectorAll('#line .tile'); if (placed.length) { ev.preventDefault(); placed[placed.length - 1].click(); }
  } else if (ev.key === 'Enter' && ev.target !== go) {
    if (ev.target.tagName === 'BUTTON' && !ev.target.classList.contains('opt')) return; // blokjes en andere knoppen: gewone klik
    ev.preventDefault();
    if (!foot.hidden && !go.disabled) go.click();
  }
});

(function () {
  const tb = document.getElementById('tabbar'), lay = document.querySelector('.layout'), wrap = document.getElementById('sidewrap');
  const upd = () => { const open = wrap.classList.contains('open'), set = lay.classList.contains('show-set');
    tb.querySelectorAll('button').forEach(b => b.classList.toggle('on', open ? b.dataset.tab === (set ? 'set' : 'lv') : b.dataset.tab === 'pad')); };
  tb.addEventListener('click', e => {
    const b = e.target.closest('button'); if (!b) return; const t = b.dataset.tab;
    if (t === 'pad') { drawer(false); if (view !== 'home') home(); }
    else { const want = t === 'set', open = wrap.classList.contains('open') && lay.classList.contains('show-set') === want;
      lay.classList.toggle('show-set', want); side(); drawer(!open); }
    upd();
  });
  new MutationObserver(upd).observe(wrap, { attributes: true, attributeFilter: ['class'] });
  // tijdens een les verdwijnt de menubalk
  const mark = () => document.body.classList.toggle('lesson', String(view).startsWith('l') || view === 'skip');
  const origSide = side; side = function () { origSide.apply(this, arguments); mark(); };
  mark();
  if ('serviceWorker' in navigator && location.protocol !== 'file:') navigator.serviceWorker.register('sw.js').catch(() => {});
})();
</script>
